<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Yearly Review — Budget Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="vendor/chart.umd.js"></script>
<style>
  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --surface2: #efede7;
    --border: rgba(0,0,0,0.09);
    --text: #1a1917;
    --muted: #7a7870;
    --red: #c94235;
    --amber: #b87318;
    --green: #2a8a5f;
    --blue: #2761a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); padding: 36px 24px 80px; max-width: 920px; margin: 0 auto; }
  h1 { font-weight: 500; font-size: 22px; letter-spacing: -0.4px; }

  .header { margin-bottom: 20px; }
  .header p { font-size: 12px; color: var(--muted); margin-top: 4px; font-family: 'DM Mono', monospace; }

  .year-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .year-nav button { border: 1px solid var(--border); background: var(--surface); border-radius: 7px; width: 32px; height: 32px; font-size: 15px; cursor: pointer; color: var(--text); }
  .year-nav .label { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; min-width: 80px; text-align: center; }

  .section-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); margin-bottom: 11px; margin-top: 32px; }
  .section-label:first-of-type { margin-top: 0; }

  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .metric { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 15px 16px; }
  .metric-label { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; letter-spacing: 0.03em; margin-bottom: 7px; }
  .metric-value { font-size: 22px; font-weight: 500; letter-spacing: -0.5px; }
  .v-green { color: var(--green); } .v-red { color: var(--red); } .v-amber { color: var(--amber); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; }
  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; }
  .empty-msg { color: var(--muted); font-size: 13px; padding: 6px 2px; }

  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-label { font-size: 13px; width: 150px; flex-shrink: 0; }
  .bar-track { flex: 1; background: var(--surface2); border-radius: 3px; height: 7px; overflow: hidden; }
  .bar-fill { height: 7px; border-radius: 3px; }
  .bar-amt { font-size: 12.5px; font-family: 'DM Mono', monospace; color: var(--text); min-width: 70px; text-align: right; }

  .rule-row { margin-bottom: 16px; }
  .rule-row:last-child { margin-bottom: 0; }
  .rule-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .rule-name { font-size: 13.5px; font-weight: 500; }
  .rule-target { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .rule-track { background: var(--surface2); border-radius: 4px; height: 10px; overflow: hidden; position: relative; }
  .rule-fill { height: 10px; border-radius: 4px; }
  .rule-marker { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); opacity: 0.35; }
  .rule-meta { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11.5px; font-family: 'DM Mono', monospace; color: var(--muted); }

  table.mtable { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.mtable th { text-align: left; font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  table.mtable td { padding: 8px 0; border-bottom: 1px solid var(--border); }
  table.mtable tr:last-child td { border-bottom: none; }
  table.mtable td.num { font-family: 'DM Mono', monospace; text-align: right; }

  @media (max-width: 620px) {
    .metrics { grid-template-columns: repeat(2,1fr); }
    .bar-label { width: 100px; font-size: 12px; }
  }
</style>
</head>
<body>

<div id="topnav-mount"></div>

  <div class="header">
    <h1>Yearly Review</h1>
    <p>The whole year, rolled up</p>
  </div>

  <div class="year-nav">
    <button id="prev-year">&larr;</button>
    <div class="label" id="year-label">—</div>
    <button id="next-year">&rarr;</button>
  </div>

  <div id="empty-state" style="display:none;" class="card">
    <div class="empty-msg">No data logged for this year yet.</div>
  </div>

  <div id="content" style="display:none;">
    <div class="section-label">Year totals</div>
    <div class="metrics">
      <div class="metric"><div class="metric-label">total income</div><div class="metric-value v-green" id="y-income">$0</div></div>
      <div class="metric"><div class="metric-label">total expenses</div><div class="metric-value" id="y-expense">$0</div></div>
      <div class="metric"><div class="metric-label">total net</div><div class="metric-value" id="y-net">$0</div></div>
      <div class="metric"><div class="metric-label">savings rate</div><div class="metric-value" id="y-rate">0%</div></div>
    </div>
    <p style="font-size: 11px; color: var(--muted); margin-top: 8px;" id="y-months-label"></p>

    <div class="section-label">50 / 30 / 20 for the year</div>
    <div class="card" id="rule-card"></div>

    <div class="section-label">Top categories this year</div>
    <div class="card" id="top-categories"></div>

    <div class="section-label">Income vs. expenses by month</div>
    <div class="chart-wrap">
      <canvas id="year-chart" height="90"></canvas>
    </div>

    <div class="section-label">Monthly breakdown</div>
    <div class="card">
      <table class="mtable" id="monthly-table"></table>
    </div>
  </div>

<script src="nav.js"></script>
<script src="yearly.js"></script>
</body>
</html>
